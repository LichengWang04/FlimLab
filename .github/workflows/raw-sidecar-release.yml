name: Installable release packages

on:
  pull_request:
    paths:
      - src/**
      - test/**
      - native/raw-worker/**
      - scripts/**
      - build/**
      - electron-builder.yml
      - package.json
      - package-lock.json
      - .github/workflows/raw-sidecar-release.yml
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: ${{ matrix.platform }}-${{ matrix.arch }} RAW sidecar
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            electron_target: win
            arch: x64
            triplet: x64-windows-static
            requires_codesign: true
          - runner: macos-15-intel
            platform: darwin
            electron_target: mac
            arch: x64
            triplet: x64-osx-filmlab
            requires_codesign: true
          - runner: macos-15
            platform: darwin
            electron_target: mac
            arch: arm64
            triplet: arm64-osx-filmlab
            requires_codesign: true
          - runner: ubuntu-22.04
            platform: linux
            electron_target: linux
            arch: x64
            triplet: x64-linux
            requires_codesign: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # GitHub-hosted runner images already contain vcpkg. Using that verified
      # image tool avoids a second bootstrap executable download; the project's
      # builtin-baseline still pins every port definition used by the manifest.
      - name: Select runner-provided vcpkg
        shell: bash
        run: |
          vcpkg_root="$VCPKG_INSTALLATION_ROOT"
          vcpkg_executable="$vcpkg_root/vcpkg"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            vcpkg_root="$(cygpath -m "$vcpkg_root")"
            vcpkg_executable="$vcpkg_root/vcpkg.exe"
          fi
          test -x "$vcpkg_executable"
          "$vcpkg_executable" version
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"

      - run: npm ci
        shell: bash

      - name: Build target sidecar into Electron's resource input tree
        shell: bash
        run: |
          configured=false
          for attempt in 1 2 3 4; do
            if cmake -S native/raw-worker -B build/raw-worker/${{ matrix.platform }}-${{ matrix.arch }} \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/native/raw-worker" \
              -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -DFILMLAB_RAW_WORKER_OUTPUT_DIR="$GITHUB_WORKSPACE/native/raw-worker/out/${{ matrix.platform }}-${{ matrix.arch }}"; then
              configured=true
              break
            fi
            if [[ "$attempt" -lt 4 ]]; then
              delay=$((attempt * 15))
              echo "CMake/vcpkg configure attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          if [[ "$configured" != "true" ]]; then
            echo "CMake/vcpkg configure failed after 4 attempts."
            exit 1
          fi
          cmake --build build/raw-worker/${{ matrix.platform }}-${{ matrix.arch }} --config Release --parallel

      - name: Verify RAW protocol and Bayer-only release capability
        shell: bash
        run: >-
          node scripts/verify-raw-sidecar.cjs
          --root "$GITHUB_WORKSPACE"
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --ping

      - run: npm run check
        shell: bash

      # Rehearses the tag-only signing configuration on every main push so an
      # expired or missing certificate surfaces before a tag build fails.
      - name: Rehearse signing configuration availability
        if: github.event_name == 'push' && github.ref_type != 'tag' && matrix.requires_codesign == 'true'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            test -n "$WIN_CSC_LINK" || missing="$missing WIN_CSC_LINK"
            test -n "$WIN_CSC_KEY_PASSWORD" || missing="$missing WIN_CSC_KEY_PASSWORD"
          else
            test -n "$MAC_CSC_LINK" || missing="$missing MAC_CSC_LINK"
            test -n "$MAC_CSC_KEY_PASSWORD" || missing="$missing MAC_CSC_KEY_PASSWORD"
            test -n "$APPLE_API_KEY" || missing="$missing APPLE_API_KEY"
            test -n "$APPLE_API_KEY_ID" || missing="$missing APPLE_API_KEY_ID"
            test -n "$APPLE_API_ISSUER" || missing="$missing APPLE_API_ISSUER"
          fi
          if [[ -n "$missing" ]]; then
            echo "::warning ::Release signing configuration is incomplete for ${{ matrix.platform }}; a tag build will fail until these secrets exist:$missing"
          else
            echo "Signing configuration is available for ${{ matrix.platform }}."
          fi

      - name: Package current platform with its verified sidecar
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm run build:release-assets
          npm run build
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${{ matrix.requires_codesign }}" == "true" ]]; then
            if [[ "${{ matrix.platform }}" == "win32" ]]; then
              test -n "$WIN_CSC_LINK"
              test -n "$WIN_CSC_KEY_PASSWORD"
            else
              test -n "$MAC_CSC_LINK"
              test -n "$MAC_CSC_KEY_PASSWORD"
              test -n "$APPLE_API_KEY_CONTENT"
              test -n "$APPLE_API_KEY_ID"
              test -n "$APPLE_API_ISSUER"
              apple_api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY_CONTENT" > "$apple_api_key_path"
              export APPLE_API_KEY="$apple_api_key_path"
            fi
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            npx electron-builder --${{ matrix.electron_target }} --${{ matrix.arch }} --publish never --config.forceCodeSigning=true
          else
            npx electron-builder --${{ matrix.electron_target }} --${{ matrix.arch }} --publish never
          fi

      - name: Install and launch packaged application (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $package = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if ($null -eq $package) { throw 'NSIS installer was not produced.' }
          node scripts/verify-installed-release.cjs --package $package.FullName

      - name: Install and launch packaged application (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          package="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$package"
          node scripts/verify-installed-release.cjs --package "$package"

      - name: Extract and launch packaged application (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          package="$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$package"
          xvfb-run -a node scripts/verify-installed-release.cjs --package "$package"

      - name: Verify Authenticode release signatures
        if: github.ref_type == 'tag' && matrix.platform == 'win32'
        shell: pwsh
        run: |
          $files = @(
            (Get-ChildItem release -Filter *.exe | Select-Object -First 1).FullName,
            (Resolve-Path release/win-unpacked/FilmLab.exe).Path,
            (Resolve-Path release/win-unpacked/resources/raw-worker/win32-${{ matrix.arch }}/filmlab-raw-worker.exe).Path
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature on $file: $($signature.Status)" }
          }

      - name: Verify Developer ID signature and notarization ticket
        if: github.ref_type == 'tag' && matrix.platform == 'darwin'
        shell: bash
        run: |
          app="$(find release -maxdepth 2 -name 'FilmLab.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/Resources/raw-worker/darwin-${{ matrix.arch }}/filmlab-raw-worker"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          hdiutil verify "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"

      - name: Remove notarization key material
        if: always() && matrix.platform == 'darwin'
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: filmlab-raw-worker-${{ matrix.platform }}-${{ matrix.arch }}
          path: native/raw-worker/out/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: filmlab-package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            build/generated/legal/FilmLab-*-sbom.cdx.json
            artifacts/installed-release.json
          if-no-files-found: error

  publish-release:
    name: Publish signed release
    if: github.ref_type == 'tag'
    needs: build-and-package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: filmlab-package-*
          path: release-downloads
          merge-multiple: true

      - name: Generate release checksums
        id: release-metadata
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir publish
          find release-downloads -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.blockmap' -o -name 'latest*.yml' -o -name 'FilmLab-*-sbom.cdx.json' \) -exec cp {} publish/ \;
          test "$(find publish -maxdepth 1 -type f | wc -l)" -ge 4
          cd publish
          find . -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          echo "sbom-path=publish/FilmLab-$version-sbom.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts with CycloneDX SBOM
        if: github.event.repository.private == false || vars.FILMLAB_ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: publish/SHA256SUMS
          sbom-path: ${{ steps.release-metadata.outputs.sbom-path }}

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: publish/*
