name: Security and dependency assurance

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit-and-sbom:
    name: Dependency audit and CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Fail on high or critical npm advisories
        run: npm audit --audit-level=high

      - name: Validate legal inventory and generate CycloneDX SBOM
        run: npm run check:compliance

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: filmlab-cyclonedx-sbom
          path: build/generated/legal/FilmLab-*-sbom.cdx.json
          if-no-files-found: error

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.FILMLAB_GHAS_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  codeql:
    name: CodeQL JavaScript/TypeScript and C++
    if: github.event.repository.private == false || vars.FILMLAB_GHAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: javascript-typescript,c-cpp
          # Manual build so the tracked C++ sidecar participates in
          # compile-based analysis instead of a shallow source-only scan.
          build-mode: manual
          queries: security-extended

      # GitHub-hosted runner images already contain vcpkg; the project's
      # builtin-baseline still pins every port definition used by the manifest.
      - name: Select runner-provided vcpkg
        shell: bash
        run: |
          vcpkg_root="$VCPKG_INSTALLATION_ROOT"
          vcpkg_executable="$vcpkg_root/vcpkg"
          test -x "$vcpkg_executable"
          "$vcpkg_executable" version
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"

      - name: Build tracked code for analysis
        shell: bash
        run: |
          npm ci
          npm run build
          cmake -S native/raw-worker -B build/codeql/raw-worker \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/native/raw-worker" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DFILMLAB_RAW_WORKER_OUTPUT_DIR="$GITHUB_WORKSPACE/build/codeql/out"
          cmake --build build/codeql/raw-worker --config Release --parallel

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
