name: unsigned-windows-prerelease

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $version) { throw "Tag $env:GITHUB_REF_NAME does not match package version $version" }
      - run: npm ci
      - run: npm run audit:release
      - run: npm run check
      - run: npm run build
      - name: Build unsigned public-beta installer
        run: npm run dist:win
      - name: Verify unsigned installer, install, smoke and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "release/FilmLab-Setup-$version-x64.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Expected an unsigned public-beta installer, found: $($signature.Status)" }
          $installDir = Join-Path $env:RUNNER_TEMP 'filmlab-install'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $appExe = Join-Path $installDir 'FilmLab.exe'
          $uninstaller = Join-Path $installDir 'Uninstall FilmLab.exe'
          foreach ($path in @($appExe, $uninstaller)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing installed executable: $path" }
            $installedSignature = Get-AuthenticodeSignature -LiteralPath $path
            if ($installedSignature.Status -ne 'NotSigned') { throw "Expected unsigned installed executable: $path ($($installedSignature.Status))" }
          }
          $smoke = Start-Process -FilePath $appExe -ArgumentList '--smoke' -WindowStyle Hidden -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed smoke exited $($smoke.ExitCode)" }
          $exportRoot = Join-Path $env:RUNNER_TEMP 'filmlab-export-smoke'
          New-Item -ItemType Directory -Path $exportRoot -Force | Out-Null
          $exportSmoke = Start-Process -FilePath $appExe -ArgumentList "--release-export-smoke=$exportRoot" -WindowStyle Hidden -Wait -PassThru
          if ($exportSmoke.ExitCode -ne 0) { throw "Installed export smoke exited $($exportSmoke.ExitCode)" }
          $exported = Get-ChildItem $exportRoot -File -Recurse | Where-Object Extension -In '.tiff','.jpg'
          if ($exported.Count -lt 8) { throw "Installed export smoke produced only $($exported.Count) image files" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
          if (Get-Process FilmLab -ErrorAction SilentlyContinue) { throw 'FilmLab process remained after uninstall' }
      - name: Write hash and build metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = Get-Item -LiteralPath "release/FilmLab-Setup-$($pkg.version)-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8
          [ordered]@{
            version = $pkg.version
            tag = $env:GITHUB_REF_NAME
            commit = $env:GITHUB_SHA
            buildTimeUtc = (Get-Date).ToUniversalTime().ToString('o')
            node = (node --version)
            electron = $pkg.devDependencies.electron
            channel = 'public-beta'
            signature = 'NotSigned'
          } | ConvertTo-Json | Set-Content release/RELEASE-METADATA.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: FilmLab-${{ github.ref_name }}-windows-x64-unsigned-public-beta
          if-no-files-found: error
          path: |
            release/FilmLab-Setup-*-x64.exe
            release/SHA256SUMS.txt
            release/RELEASE-METADATA.json
            CHANGELOG.md
            PRIVACY.md
            docs/PUBLIC_BETA.md
            docs/RAW_ACCEPTANCE.md
            docs/NEGADOCTOR_ACCEPTANCE_RESULTS.json
      - name: Publish prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/FilmLab-Setup-$version-x64.exe"
          gh release create $env:GITHUB_REF_NAME $installer release/SHA256SUMS.txt release/RELEASE-METADATA.json CHANGELOG.md PRIVACY.md docs/PUBLIC_BETA.md docs/RAW_ACCEPTANCE.md docs/NEGADOCTOR_ACCEPTANCE_RESULTS.json --prerelease --title "FilmLab $version 公共测试版（未签名）" --notes-file docs/PUBLIC_BETA.md --verify-tag
