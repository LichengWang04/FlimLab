name: signed-windows-release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $version) { throw "Tag $env:GITHUB_REF_NAME does not match package version $version" }
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm run build
      - name: Build signed installer
        run: npm run dist:win
      - name: Verify signatures, install, smoke and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'FilmLab-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Signed installer was not produced' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw "Installer signature or timestamp invalid: $($signature.Status)" }
          $installDir = Join-Path $env:RUNNER_TEMP 'filmlab-install'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $appExe = Join-Path $installDir 'FilmLab.exe'
          $uninstaller = Join-Path $installDir 'Uninstall FilmLab.exe'
          foreach ($path in @($appExe, $uninstaller)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing installed executable: $path" }
            $installedSignature = Get-AuthenticodeSignature -LiteralPath $path
            if ($installedSignature.Status -ne 'Valid' -or -not $installedSignature.TimeStamperCertificate) { throw "Invalid installed signature: $path" }
          }
          $smoke = Start-Process -FilePath $appExe -ArgumentList '--smoke' -WindowStyle Hidden -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed smoke exited $($smoke.ExitCode)" }
          $exportRoot = Join-Path $env:RUNNER_TEMP 'filmlab-export-smoke'
          New-Item -ItemType Directory -Path $exportRoot -Force | Out-Null
          $exportSmoke = Start-Process -FilePath $appExe -ArgumentList "--release-export-smoke=$exportRoot" -WindowStyle Hidden -Wait -PassThru
          if ($exportSmoke.ExitCode -ne 0) { throw "Installed export smoke exited $($exportSmoke.ExitCode)" }
          $exported = Get-ChildItem $exportRoot -File -Recurse | Where-Object Extension -In '.tiff','.jpg'
          if ($exported.Count -lt 8) { throw "Installed export smoke produced only $($exported.Count) image files" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
      - name: Write hashes and build metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          Get-ChildItem release -File | Where-Object Extension -In '.exe','.blockmap','.yml' | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
          [ordered]@{
            version = $pkg.version
            tag = $env:GITHUB_REF_NAME
            commit = $env:GITHUB_SHA
            buildTimeUtc = (Get-Date).ToUniversalTime().ToString('o')
            node = (node --version)
            electron = $pkg.devDependencies.electron
          } | ConvertTo-Json | Set-Content release/RELEASE-METADATA.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: FilmLab-${{ github.ref_name }}-windows-x64-signed
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/SHA256SUMS.txt
            release/RELEASE-METADATA.json
      - name: Publish prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME release/*.exe release/*.blockmap release/*.yml release/SHA256SUMS.txt release/RELEASE-METADATA.json --prerelease --generate-notes --verify-tag
