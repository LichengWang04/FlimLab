appId: com.filmlab.app
productName: FilmLab
directories:
  output: release
files:
  - out/**
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.photography
linux:
  target: AppImage
  category: Graphics
npmRebuild: true
